version: 2
updates:
  # Covers every package in the pnpm workspace (pnpm-lock.yaml at the root).
  - package-ecosystem: npm
    directory: /
    # Units merge into develop; main only takes releases (main is the default branch).
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Minor and patch updates for the whole workspace arrive as one PR; majors stay separate.
      workspace-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
