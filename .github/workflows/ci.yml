name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a push run: the secrets scan of a push covers only that push's commits.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for Vercel Remote Cache
    steps:
      - uses: actions/checkout@v7
      # Short-lived Turborepo token via OIDC; no stored secret. Skipped until TURBO_TEAM is set.
      - uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        if: vars.TURBO_TEAM != ''
        with:
          team: ${{ vars.TURBO_TEAM }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Same build Vercel runs, with no env: secrets are read per request, never at build time.
      - run: pnpm build

  # Fails when a pushed or PR commit adds a secret. It scans only those commits, not all history.
  # By then the secret is already on GitHub: rotate it anyway (runbook → Secret exposure).
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the action lists the PR's commits to pick its scan range
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks walks the commit range, so it needs the history
      # Personal-account repo: no GITLEAKS_LICENSE needed. The token is read-only (PR commits, owner type).
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The read-only token can't comment on PRs; findings go to the job summary instead.
          GITLEAKS_ENABLE_COMMENTS: "false"
